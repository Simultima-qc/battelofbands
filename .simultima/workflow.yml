schema_version: 1

# Non-secret operational profile. Repository reality and the latest central
# Playbook / AGENTS.md remain authoritative if this file becomes stale.
repository:
  default_branch: main

delivery:
  default_mode: DIRECT
  integration_branch: null
  production_branch: main
  production_deploy_from_implementation_merge: false

validation:
  commands:
    test: "cd server && npm test && cd ../client && npm test"
    lint: null
    build: "cd client && npm run build"

ci:
  workflow_name: "server-tests.yml + client-tests.yml"

deployment:
  provider: netlify
  preview_supported: true

database:
  # Production uses Neon hosted Postgres; local development defaults to SQLite.
  provider: postgres
  migrations_path: server/db/migrations

environments:
  non_production: []
  production: netlify
